<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
{% seo title=false %}

<link rel="icon" href="{{ '/assets/img/favicon-192.png' | relative_url }}" type="image/png" sizes="192x192">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<link rel="preload" href="{{ '/assets/fonts/inter.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/space-grotesk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<meta name="referrer" content="strict-origin-when-cross-origin">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Marco Bacci",
  "description": {{ site.description | jsonify }},
  "url": {{ site.url | jsonify }},
  "email": {{ site.author.email | jsonify }},
  "telephone": {{ site.author.telefono_link | jsonify }},
  "vatID": "IT{{ site.legal.piva }}",
  "address": { "@type": "PostalAddress", "addressLocality": "Roma", "addressCountry": "IT" },
  "sameAs": [{{ site.linkedin_url | jsonify }}, {{ site.instagram_url | jsonify }}],
  "areaServed": "IT",
  "knowsLanguage": "it",
  "serviceType": "Formazione e consulenza sull'intelligenza artificiale"
}
</script>
</head>

<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-logo">
    <picture>
      <source media="(max-width: 640px)" data-srcset="{{ '/assets/img/logo/logo-mb-ai-splash-verticale.svg' | relative_url }}">
      <img data-src="{{ '/assets/img/logo/logo-mb-ai-splash.svg' | relative_url }}" width="1200" height="404" alt="">
    </picture>
  </div>
  <button class="splash-salta" type="button" tabindex="-1">Salta</button>
</div>
<script>
  /* Apertura con il logo animato: solo alla prima pagina della visita,
     mai con "riduci movimento". Si chiude da sola o con un clic/tasto. */
  (function () {
    var d = document.documentElement, s = document.getElementById('splash');
    try {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (sessionStorage.getItem('splash-vista')) return;
      sessionStorage.setItem('splash-vista', '1');
    } catch (e) { return; }
    var src = s.querySelector('source'), img = s.querySelector('img');
    src.srcset = src.getAttribute('data-srcset');
    img.src = img.getAttribute('data-src');
    d.classList.add('con-splash');
    var chiuso = false;
    function chiudi() {
      if (chiuso) return; chiuso = true;
      s.classList.add('via');
      setTimeout(function () { d.classList.remove('con-splash'); s.remove(); }, 750);
    }
    var avviato = false;
    function avvia() { if (avviato) return; avviato = true; setTimeout(chiudi, 5300); }
    img.addEventListener('load', avvia);
    img.addEventListener('error', chiudi);
    setTimeout(avvia, 1500);
    s.addEventListener('click', chiudi);
    document.addEventListener('keydown', chiudi, { once: true });
  })();
</script>
<a class="skip" href="#main">Vai al contenuto</a>

{% include header.html %}

<main id="main">
  {{ content }}
</main>

{% include footer.html %}

<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.getElementById('nav');
    if (!toggle || !nav) return;
    toggle.addEventListener('click', function () {
      var open = nav.getAttribute('data-open') === 'true';
      nav.setAttribute('data-open', String(!open));
      toggle.setAttribute('aria-expanded', String(!open));
      toggle.textContent = open ? 'Menu' : 'Chiudi';
    });
  })();

  /* Movimento. Se JavaScript è disattivato o l'utente preferisce ridurre
     le animazioni, la classe non viene aggiunta e il sito resta statico
     ma completamente leggibile. */
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('IntersectionObserver' in window)) return;

    document.body.classList.add('js-anim');

    var bersagli = document.querySelectorAll(
      '.section-head, .split > *, .card, .project, .book, ' +
      '.optin, .faq, .path-step, .booking-frame'
    );

    Array.prototype.forEach.call(bersagli, function (el) {
      el.setAttribute('data-rivela', '');
    });

    /* Sfalsa gli elementi che stanno nella stessa griglia */
    Array.prototype.forEach.call(document.querySelectorAll('.grid'), function (g) {
      Array.prototype.forEach.call(g.children, function (figlio, i) {
        figlio.style.setProperty('--i', i);
      });
    });

    var osservatore = new IntersectionObserver(function (voci) {
      voci.forEach(function (voce) {
        if (voce.isIntersecting) {
          voce.target.classList.add('visibile');
          osservatore.unobserve(voce.target);
        }
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

    Array.prototype.forEach.call(bersagli, function (el) {
      osservatore.observe(el);
    });

    /* Il percorso non usa data-rivela: gli serve solo la classe visibile */
    Array.prototype.forEach.call(document.querySelectorAll('.path-step'), function (el) {
      el.removeAttribute('data-rivela');
    });

    /* Elenco a barre: la voce accesa scorre da sola, si ferma al passaggio del mouse */
    Array.prototype.forEach.call(document.querySelectorAll('.bars'), function (lista) {
      var voci = lista.querySelectorAll('li');
      if (voci.length < 2) return;
      var i = 0, fermo = false;
      Array.prototype.forEach.call(voci, function (v, k) {
        if (v.classList.contains('acceso')) i = k;
      });
      /* Pausa solo con un mouse vero: sul telefono il tocco simula il passaggio
         del mouse ma non lo "toglie" mai, e la sequenza restava ferma */
      lista.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') fermo = true; });
      lista.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') fermo = false; });
      setInterval(function () {
        if (fermo || document.hidden) return;
        voci[i].classList.remove('acceso');
        i = (i + 1) % voci.length;
        voci[i].classList.add('acceso');
      }, 2800);
    });

    /* Intestazione che si stacca */
    var testata = document.querySelector('.site-header');
    if (testata) {
      var aggiorna = function () {
        testata.classList.toggle('staccata', window.scrollY > 12);
      };
      aggiorna();
      window.addEventListener('scroll', aggiorna, { passive: true });
    }
  })();
</script>
</body>
</html>
