- nome: "CloudScanner"
  tag: "Costi e fornitori"
  sottotitolo: "Confronta i costi di otto fornitori cloud"
  problema: "Confrontare prezzi e programmi partner di otto fornitori cloud voleva dire ore passate tra listini e documenti diversi."
  descrizione: "Uno strumento per consulenti informatici e agenzie che rivendono servizi cloud. Confronta i prezzi di otto fornitori, calcola il margine di rivendita e riassume i programmi di partnership ufficiali."
  tecnologia: "Pagina web costruita con l'aiuto dell'intelligenza artificiale, con dati presi dai listini e dai programmi partner ufficiali. I calcoli avvengono nel browser."
  risultato: "Online, gratuito, si usa senza registrazione. Un confronto che richiedeva ore si fa in pochi clic."
  per_te: "Lo stesso metodo funziona per confrontare i tuoi fornitori, le tariffe o i preventivi che ricevi."
  url: "/CloudScanner/"
  immagine: ""
