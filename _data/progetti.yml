- nome: "WorldEconomy"
  tag: "Dati pubblici"
  sottotitolo: "Confronta le grandi economie del mondo"
  problema: "I dati economici pubblici esistono, ma sono sparsi in tabelle lunghe, difficili da leggere e da tenere aggiornate."
  descrizione: "Un cruscotto che mette a confronto sette economie, tra cui Italia, Germania, Stati Uniti e Cina, su otto indicatori: crescita, inflazione, disoccupazione, debito pubblico e altri, dal 2010 al 2023."
  tecnologia: "Pagina web leggera collegata in tempo reale alla Banca Mondiale. Codice scritto con l'aiuto dell'intelligenza artificiale."
  risultato: "Online e gratuito. Si aggiorna da solo a ogni apertura: nessun foglio di calcolo da sistemare a mano."
  per_te: "Un cruscotto simile può mostrarti a colpo d'occhio i numeri che oggi cerchi in più file."
