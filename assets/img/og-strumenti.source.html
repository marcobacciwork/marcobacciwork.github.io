<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Inter"; src: url("../fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; justify-content: center; padding: 0 92px;
    font-family: "Inter", sans-serif; color: #EDF1F7;
    background-color: #0F172A;
    background-image:
      radial-gradient(circle at 92% 8%, rgba(51,85,255,.42) 0%, transparent 42%),
      linear-gradient(rgba(237,241,247,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(237,241,247,.045) 1px, transparent 1px);
    background-size: auto, 40px 40px, 40px 40px;
  }
  .eyebrow { font-size: 19px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #7C95FF; margin-bottom: 34px; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: #3355FF; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 70px; line-height: 1.06; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: #7C95FF; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.45; color: #9AA6BC; max-width: 860px; }
  .foot { margin-top: 46px; padding-top: 26px; border-top: 1px solid rgba(237,241,247,.16); display: flex; justify-content: space-between; font-size: 21px; color: #9AA6BC; }
  .foot b { color: #EDF1F7; font-weight: 500; }
</style></head><body>
  <div class="eyebrow">Marco Bacci · Strumenti gratuiti</div>
  <h1>Capire l'AI<br><em>con i tuoi numeri.</em></h1>
  <p>Costi, rischi e opportunità dell'intelligenza artificiale per studi e imprese. Senza registrazione.</p>
  <div class="foot"><span>Studi professionali e imprese</span><b>marcobacci.it/strumenti</b></div>
</body></html>
