<div class="social-row">
  <a class="social" href="{{ site.linkedin_url }}" rel="me noopener" target="_blank"
     aria-label="Il mio profilo LinkedIn, si apre in una nuova scheda">
    <span class="social-testo">
      <span class="social-nome">LinkedIn</span>
      <span class="social-handle">{{ site.linkedin_nome }}</span>
    </span>
    <span class="social-freccia" aria-hidden="true">↗</span>
  </a>
  <a class="social" href="{{ site.instagram_url }}" rel="me noopener" target="_blank"
     aria-label="Il mio profilo Instagram, si apre in una nuova scheda">
    <span class="social-testo">
      <span class="social-nome">Instagram</span>
      <span class="social-handle">{{ site.instagram_nome }}</span>
    </span>
    <span class="social-freccia" aria-hidden="true">↗</span>
  </a>
</div>
